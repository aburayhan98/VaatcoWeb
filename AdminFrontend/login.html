<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Login - VAATCO</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="stylesheet" href="styles.css" />
    <style>
      body {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .login-container {
        max-width: 400px;
        width: 100%;
      }
      .login-card {
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(10px);
        border-radius: 20px;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.2);
      }
      .login-header {
        background: linear-gradient(135deg, #0066cc, #32cd32);
        color: white;
        padding: 2rem;
        border-radius: 20px 20px 0 0;
        text-align: center;
      }
      .login-body {
        padding: 2rem;
      }
      .form-control:focus {
        border-color: #0066cc;
        box-shadow: 0 0 0 0.2rem rgba(0, 102, 204, 0.25);
      }
      .btn-login {
        background: linear-gradient(135deg, #0066cc, #32cd32);
        border: none;
        padding: 12px;
        font-weight: 600;
        border-radius: 10px;
        transition: all 0.3s ease;
        position: relative;
        overflow: hidden;
      }
      .btn-login:hover:not(:disabled) {
        transform: translateY(-2px);
        box-shadow: 0 10px 25px rgba(0, 102, 204, 0.3);
      }
      .btn-login:disabled {
        opacity: 0.7;
        cursor: not-allowed;
        transform: none;
      }
      .logo-text {
        font-size: 1.8rem;
        font-weight: 800;
        margin-bottom: 0.5rem;
      }
      .alert-custom {
        border-radius: 10px;
        margin-top: 1rem;
        animation: slideIn 0.3s ease;
      }
      .spinner-overlay {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(255, 255, 255, 0.2);
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: inherit;
      }
      .forgot-password-link {
        color: #0066cc;
        text-decoration: none;
        font-size: 0.9rem;
        transition: color 0.3s ease;
      }
      .forgot-password-link:hover {
        color: #32cd32;
        text-decoration: underline;
      }
      .form-switch {
        margin-top: 1.5rem;
        padding-bottom: 1rem;
        border-bottom: 1px solid #dee2e6;
      }
      .switch-link {
        color: #0066cc;
        cursor: pointer;
        text-decoration: none;
      }
      .switch-link:hover {
        color: #32cd32;
        text-decoration: underline;
      }
      @keyframes slideIn {
        from {
          opacity: 0;
          transform: translateY(-10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }
      .spinner {
        width: 20px;
        height: 20px;
        border: 2px solid rgba(255, 255, 255, 0.3);
        border-top: 2px solid white;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }
    </style>
  </head>
  <body>
    <div class="login-container">
      <div class="login-card">
        <div class="login-header">
          <div class="logo-text">
            <i class="fas fa-user-shield me-2"></i>VAATCO
          </div>
          <p class="mb-0" id="headerText">Admin Panel Login</p>
        </div>
        <div class="login-body">
          <!-- Login Form -->
          <form id="loginForm">
            <div class="mb-3">
              <label class="form-label">
                <i class="fas fa-user me-2"></i>Email Address
              </label>
              <input
                type="email"
                class="form-control"
                id="email"
                required
                placeholder="Enter your email address"
                autocomplete="email"
              />
            </div>
            <div class="mb-3">
              <label class="form-label">
                <i class="fas fa-lock me-2"></i>Password
              </label>
              <input
                type="password"
                class="form-control"
                id="password"
                required
                placeholder="Enter your password"
                autocomplete="current-password"
              />
            </div>
            <div class="mb-3 text-end">
              <a
                href="#"
                class="forgot-password-link"
                onclick="showForgotPasswordForm()"
              >
                <i class="fas fa-key me-1"></i>Forgot Password?
              </a>
            </div>
            <button
              class="btn btn-primary btn-login w-100"
              type="submit"
              id="loginButton"
            >
              <span class="button-text">
                <i class="fas fa-sign-in-alt me-2"></i>Sign In
              </span>
            </button>
          </form>

          <!-- Forgot Password Form -->
          <form id="forgotPasswordForm" class="d-none">
            <div class="mb-3">
              <label class="form-label">
                <i class="fas fa-envelope me-2"></i>Email Address
              </label>
              <input
                type="email"
                class="form-control"
                id="forgotEmail"
                required
                placeholder="Enter your email address"
                autocomplete="email"
              />
              <small class="text-muted">
                Enter your email to receive a password reset link
              </small>
            </div>
            <button
              class="btn btn-primary btn-login w-100"
              type="submit"
              id="forgotButton"
            >
              <span class="button-text">
                <i class="fas fa-paper-plane me-2"></i>Send Reset Link
              </span>
            </button>
            <div class="form-switch text-center">
              <span class="text-muted">Remember your password? </span>
              <a href="#" class="switch-link" onclick="showLoginForm()">
                Back to Login
              </a>
            </div>
          </form>

          <div id="errorMessage" class="alert alert-danger alert-custom d-none">
            <i class="fas fa-exclamation-triangle me-2"></i>
            <span id="errorText">Invalid credentials. Please try again.</span>
          </div>

          <div
            id="successMessage"
            class="alert alert-success alert-custom d-none"
          >
            <i class="fas fa-check-circle me-2"></i>
            <span id="successText">Login successful! Redirecting...</span>
          </div>

          <div class="text-center mt-3">
            <small class="text-muted">
              <i class="fas fa-info-circle me-1"></i>
              <span id="footerText"
                >Enter your admin credentials to access the dashboard</span
              >
            </small>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Include the auth utility first -->
    <script src="auth.js"></script>

    <script>
      // Form state management
      let currentForm = "login";

      // UI Helper functions
      function showMessage(type, message) {
        const errorDiv = document.getElementById("errorMessage");
        const successDiv = document.getElementById("successMessage");

        // Hide both messages first
        errorDiv.classList.add("d-none");
        successDiv.classList.add("d-none");

        if (type === "error") {
          document.getElementById("errorText").textContent = message;
          errorDiv.classList.remove("d-none");

          // Auto-hide error after 7 seconds
          setTimeout(() => {
            errorDiv.classList.add("d-none");
          }, 7000);
        } else if (type === "success") {
          document.getElementById("successText").textContent = message;
          successDiv.classList.remove("d-none");
        }
      }

      function setButtonState(buttonId, loading) {
        const button = document.getElementById(buttonId);
        const buttonText = button.querySelector(".button-text");

        if (loading) {
          button.disabled = true;

          // Create spinner overlay
          const spinnerOverlay = document.createElement("div");
          spinnerOverlay.className = "spinner-overlay";
          spinnerOverlay.innerHTML = '<div class="spinner"></div>';
          button.appendChild(spinnerOverlay);

          buttonText.style.opacity = "0.5";
        } else {
          button.disabled = false;

          // Remove spinner overlay
          const spinnerOverlay = button.querySelector(".spinner-overlay");
          if (spinnerOverlay) {
            spinnerOverlay.remove();
          }

          buttonText.style.opacity = "1";
        }
      }

      // Form switching functions
      function showForgotPasswordForm() {
        currentForm = "forgot";
        document.getElementById("loginForm").classList.add("d-none");
        document
          .getElementById("forgotPasswordForm")
          .classList.remove("d-none");
        document.getElementById("headerText").textContent = "Reset Password";
        document.getElementById("footerText").textContent =
          "Enter your email to receive a password reset link";

        // Clear any existing messages
        document.getElementById("errorMessage").classList.add("d-none");
        document.getElementById("successMessage").classList.add("d-none");

        // Focus on email field
        setTimeout(() => {
          document.getElementById("forgotEmail").focus();
        }, 100);
      }

      function showLoginForm() {
        currentForm = "login";
        document.getElementById("forgotPasswordForm").classList.add("d-none");
        document.getElementById("loginForm").classList.remove("d-none");
        document.getElementById("headerText").textContent = "Admin Panel Login";
        document.getElementById("footerText").textContent =
          "Enter your admin credentials to access the dashboard";

        // Clear any existing messages
        document.getElementById("errorMessage").classList.add("d-none");
        document.getElementById("successMessage").classList.add("d-none");

        // Focus on email field
        setTimeout(() => {
          document.getElementById("email").focus();
        }, 100);
      }

      // Forgot password functionality
      async function sendPasswordResetEmail(email) {
        try {
          const response = await fetch(
            "https://api.vaatcobd.com/api/admin/forgot-password",
            {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
              },
              body: JSON.stringify({ email: email.trim() }),
            }
          );

          const data = await response.json();

          if (response.ok && data.status) {
            return {
              success: true,
              message:
                data.message || "Password reset email sent successfully!",
            };
          } else {
            return {
              success: false,
              message: data.message || "Failed to send reset email",
            };
          }
        } catch (error) {
          console.error("Forgot password error:", error);
          return {
            success: false,
            message:
              "Network error. Please check your connection and try again.",
          };
        }
      }

      // Login form handler
      document
        .getElementById("loginForm")
        .addEventListener("submit", async function (e) {
          e.preventDefault();

          const email = document.getElementById("email").value.trim();
          const password = document.getElementById("password").value.trim();

          // Validation
          if (!email || !password) {
            showMessage("error", "Please enter both email and password.");
            return;
          }

          if (!isValidEmail(email)) {
            showMessage("error", "Please enter a valid email address.");
            return;
          }

          // Show loading state
          setButtonState("loginButton", true);

          try {
            // Attempt login using AuthManager
            const result = await window.authManager.login(email, password);

            if (result.success) {
              showMessage(
                "success",
                result.message || "Login successful! Redirecting..."
              );

              // Clear form
              document.getElementById("email").value = "";
              document.getElementById("password").value = "";

              // Redirect to dashboard after a brief delay
              setTimeout(() => {
                window.location.href = "dashboard.html";
              }, 1500);
            } else {
              showMessage(
                "error",
                result.message || "Login failed. Please try again."
              );
              document.getElementById("password").value = "";
            }
          } catch (error) {
            console.error("Login error:", error);
            showMessage(
              "error",
              "An unexpected error occurred. Please try again."
            );
          } finally {
            setButtonState("loginButton", false);
          }
        });

      // Forgot password form handler
      document
        .getElementById("forgotPasswordForm")
        .addEventListener("submit", async function (e) {
          e.preventDefault();

          const email = document.getElementById("forgotEmail").value.trim();

          // Validation
          if (!email) {
            showMessage("error", "Please enter your email address.");
            return;
          }

          if (!isValidEmail(email)) {
            showMessage("error", "Please enter a valid email address.");
            return;
          }

          // Show loading state
          setButtonState("forgotButton", true);

          try {
            const result = await sendPasswordResetEmail(email);

            if (result.success) {
              showMessage("success", result.message);

              // Clear form
              document.getElementById("forgotEmail").value = "";

              // Optionally switch back to login form after success
              setTimeout(() => {
                showLoginForm();
                showMessage(
                  "success",
                  "Password reset email sent! Check your inbox and follow the instructions."
                );
              }, 2000);
            } else {
              showMessage("error", result.message);
            }
          } catch (error) {
            console.error("Forgot password error:", error);
            showMessage(
              "error",
              "An unexpected error occurred. Please try again."
            );
          } finally {
            setButtonState("forgotButton", false);
          }
        });

      // Email validation helper
      function isValidEmail(email) {
        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        return emailRegex.test(email);
      }

      // Clear messages when user starts typing
      document.getElementById("email").addEventListener("input", function () {
        document.getElementById("errorMessage").classList.add("d-none");
      });

      document
        .getElementById("password")
        .addEventListener("input", function () {
          document.getElementById("errorMessage").classList.add("d-none");
        });

      document
        .getElementById("forgotEmail")
        .addEventListener("input", function () {
          document.getElementById("errorMessage").classList.add("d-none");
        });

      // Handle enter key on form fields
      document
        .getElementById("email")
        .addEventListener("keypress", function (e) {
          if (e.key === "Enter") {
            document.getElementById("password").focus();
          }
        });

      document
        .getElementById("password")
        .addEventListener("keypress", function (e) {
          if (e.key === "Enter") {
            document
              .getElementById("loginForm")
              .dispatchEvent(new Event("submit"));
          }
        });

      document
        .getElementById("forgotEmail")
        .addEventListener("keypress", function (e) {
          if (e.key === "Enter") {
            document
              .getElementById("forgotPasswordForm")
              .dispatchEvent(new Event("submit"));
          }
        });

      // Initialize page
      document.addEventListener("DOMContentLoaded", function () {
        // Focus on email field
        document.getElementById("email").focus();

        // AuthManager will automatically handle redirect if already logged in
        console.log("Login page loaded");
      });
    </script>
  </body>
</html>

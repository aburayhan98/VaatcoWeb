<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login - VAATCO</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    body {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .login-container {
      max-width: 400px;
      width: 100%;
    }
    .login-card {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    .login-header {
      background: linear-gradient(135deg, #0066cc, #32CD32);
      color: white;
      padding: 2rem;
      border-radius: 20px 20px 0 0;
      text-align: center;
    }
    .login-body {
      padding: 2rem;
    }
    .form-control:focus {
      border-color: #0066cc;
      box-shadow: 0 0 0 0.2rem rgba(0, 102, 204, 0.25);
    }
    .btn-login {
      background: linear-gradient(135deg, #0066cc, #32CD32);
      border: none;
      padding: 12px;
      font-weight: 600;
      border-radius: 10px;
      transition: all 0.3s ease;
    }
    .btn-login:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(0, 102, 204, 0.3);
    }
    .logo-text {
      font-size: 1.8rem;
      font-weight: 800;
      margin-bottom: 0.5rem;
    }
    .alert-custom {
      border-radius: 10px;
      margin-top: 1rem;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <div class="login-header">
        <div class="logo-text">
          <i class="fas fa-user-shield me-2"></i>VAATCO
        </div>
        <p class="mb-0">Admin Panel Login</p>
      </div>
      <div class="login-body">
        <form id="loginForm">
          <div class="mb-3">
            <label class="form-label">
              <i class="fas fa-user me-2"></i>Username
            </label>
            <input type="text" class="form-control" id="username" required placeholder="Enter your username" />
          </div>
          <div class="mb-3">
            <label class="form-label">
              <i class="fas fa-lock me-2"></i>Password
            </label>
            <input type="password" class="form-control" id="password" required placeholder="Enter your password" />
          </div>
          <button class="btn btn-primary btn-login w-100" type="submit">
            <i class="fas fa-sign-in-alt me-2"></i>Sign In
          </button>
        </form>
        <div id="errorMessage" class="alert alert-danger alert-custom d-none">
          <i class="fas fa-exclamation-triangle me-2"></i>
          <span id="errorText">Invalid credentials. Please try again.</span>
        </div>
        <div class="text-center mt-3">
          <small class="text-muted">
            <i class="fas fa-info-circle me-1"></i>
            Default: admin / admin123
          </small>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // Simple login functionality
    const DEMO_USER = { username: 'admin', password: 'admin123' };
    const STORAGE_KEY = 'vaatco_admin_auth';

    function login(username, password) {
      if (username === DEMO_USER.username && password === DEMO_USER.password) {
        localStorage.setItem(STORAGE_KEY, 'true');
        return true;
      }
      return false;
    }

    function showError(message) {
      const errorDiv = document.getElementById('errorMessage');
      const errorText = document.getElementById('errorText');
      errorText.textContent = message;
      errorDiv.classList.remove('d-none');
      setTimeout(() => {
        errorDiv.classList.add('d-none');
      }, 5000);
    }

    // Check if already logged in
    if (localStorage.getItem(STORAGE_KEY) === 'true') {
      window.location.href = 'dashboard.html';
    }

    document.getElementById('loginForm').addEventListener('submit', function(e) {
      e.preventDefault();
      
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value.trim();
      
      if (!username || !password) {
        showError('Please enter both username and password.');
        return;
      }
      
      if (login(username, password)) {
        // Success - redirect to dashboard
        window.location.href = 'dashboard.html';
      } else {
        showError('Invalid credentials. Please check your username and password.');
        document.getElementById('password').value = '';
      }
    });

    // Add loading animation on form submit
    document.getElementById('loginForm').addEventListener('submit', function() {
      const submitBtn = this.querySelector('button[type="submit"]');
      const originalText = submitBtn.innerHTML;
      submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i>Signing In...';
      submitBtn.disabled = true;
      
      setTimeout(() => {
        submitBtn.innerHTML = originalText;
        submitBtn.disabled = false;
      }, 1500);
    });
  </script>
</body>
</html>
